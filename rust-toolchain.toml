# Canonical Rust toolchain definition (read by rustup, cargo, IDEs, and mise).
# This is the single source of truth for the DEVELOPMENT toolchain, and it tracks
# stable.
#
# It is deliberately DECOUPLED from `rust-version` in Cargo.toml, which is a
# different promise: the oldest rustc that builds nvmrc (`cargo install` from
# source). Keeping the two in sync would turn every routine toolchain bump into
# a raised MSRV for no reason.
#
# So: bump this freely to pick up new compiler features and lints. Only change
# `rust-version` when the code genuinely stops building on the old floor. The
# `msrv` job in .github/workflows/ci.yml (and `mise run test:msrv`) enforces
# the gap by compiling against `rust-version`, not against this file.
[toolchain]
channel = "1.99"
profile = "default"
# rustfmt + clippy come with `profile = "default"` but are listed explicitly as a
# guarantee. llvm-tools provides the `rust-objcopy` that the release profile's
# `strip = "symbols"` (.cargo/config.toml) uses, as the README notes.
# rust-src is needed for rust-analyzer/IDE std navigation and source-based
# tooling; declaring it keeps fresh clones and CI reproducible (not IDE-only).
components = ["rustfmt", "clippy", "llvm-tools", "rust-src"]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]