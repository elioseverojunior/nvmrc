usage = '''
flag "-v --verbose" help="Enable verbose (debug) output"
'''

[tasks."lint:rust"]
alias = ["clippy"]
description = "Clippy on every target and feature, warnings denied"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

[ "${usage_verbose:-false}" = "true" ] && set -x

cargo clippy --all-targets --all-features --locked -- -D warnings
'''
shell = "bash -c"
usage = '''
flag "-v --verbose" help="Enable verbose (debug) output"
'''

[tasks."lint:docs"]
alias = ["md"]
description = "Lint the Markdown with rumdl"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

[ "${usage_verbose:-false}" = "true" ] && set -x

rumdl check .
'''
shell = "bash -c"
usage = '''
flag "-v --verbose" help="Enable verbose (debug) output"
'''

[tasks."lint:actions"]
alias = ["al"]
description = "Lint the GitHub Actions workflows with actionlint"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

[ "${usage_verbose:-false}" = "true" ] && set -x

actionlint
'''
shell = "bash -c"
usage = '''
flag "-v --verbose" help="Enable verbose (debug) output"
'''

[tasks."lint:docker"]
