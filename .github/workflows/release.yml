name: release

# A `v*` tag on the default branch releases; a manual run is a dry run (build,
# package, smoke tests) by default. Steps run `mise run release:*` tasks, as `release:snapshot` does.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build, package and smoke-test; sign, attest and publish nothing
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  # Each job installs only the tools it names; `mise run` must not fetch the rest.
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  gates:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  version:
    name: version and tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the default branch, for the ancestry check
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install: false
          cache: false
      - id: check
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
          PRIVATE: ${{ github.event.repository.private }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: >-
          mise run -q release:check:ci --dry-run "$DRY_RUN" --private "$PRIVATE"
          --default-branch "$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.target }})
    needs: [gates, version]
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          # The glibc builds' floor (2.34) is what release:build measures.
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm }
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, runner: macos-15-intel }
          - { target: aarch64-apple-darwin, runner: macos-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the musl C toolchain
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      # No cache: nothing an earlier run left can reach a signed archive.
      - uses: elioseverojunior/rust-toolchain@53d2299d557a901de7517771d4ce9e89b70d4439 # v0.8.0-5
        with:
          targets: ${{ matrix.target }}
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install: false
          cache: false
      - run: mise run release:build --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  package:
    name: packages, SBOM and checksums
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-*
          path: dist
          merge-multiple: true
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: nfpm syft
          cache: false
      - run: mise run release:package
      - run: mise run release:sums
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error

  smoke:
    name: package and image smoke tests (${{ matrix.arch }})
    needs: package
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: dist
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install: false
          cache: false
      - run: mise run release:smoke --arch "$PACKAGE_ARCH"
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
      - run: mise run release:image --arch "$PACKAGE_ARCH"
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}

  sign-and-attest:
    name: sign and attest
    needs: [version, smoke]
    # A dry run stops after the smoke tests: a signature or an attestation
    # only ever names a published, tagged release.
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: dist
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: cosign
          cache: false
      - name: Sign every release file, SHA256SUMS included (keyless)
        run: |
          for file in dist/*; do
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
          done
      - name: Unpack the binaries, which are attested one by one
        run: |
          mkdir -p binaries
          for archive in dist/*.tar.gz; do tar -xzf "$archive" -C binaries; done
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            binaries/*/nvmrc
            binaries/*/nvm
            binaries/*/nvm-exec
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
          sbom-path: dist/nvmrc-${{ needs.version.outputs.version }}.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-files
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish the release, the image and the formula
    needs: [version, sign-and-attest]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git-cliff reads the history
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-files
          path: dist
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: cosign git-cliff
          cache: false
      - run: mise run release:notes
      # A draft until the last step: a failure leaves no public release
      # without its image or formula, and a re-run updates the draft.
      - run: mise run release:github:draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - run: mise run release:image:context
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=nvmrc
            org.opencontainers.image.description=A native Rust port of nvm, the Node Version Manager
            org.opencontainers.image.licenses=MIT
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: target/image
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
      - name: Run the pushed image, by digest, then sign it
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mise run release:image:run --image "$IMAGE@$DIGEST" --arch amd64
          cosign sign --yes "$IMAGE@$DIGEST"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      # The tap is off until the owner sets the NVMRC_HOMEBREW_TAP variable
      # (owner/name) and the HOMEBREW_TAP_TOKEN secret (contents: write there).
      - if: vars.NVMRC_HOMEBREW_TAP != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.NVMRC_HOMEBREW_TAP }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - if: vars.NVMRC_HOMEBREW_TAP != ''
        run: |
          mise run release:homebrew --repository "$GITHUB_REPOSITORY"
          mise run release:homebrew:tap --tap tap
      - run: gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
