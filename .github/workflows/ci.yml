name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml re-runs every gate on the commit it releases.
  workflow_call:

permissions:
  contents: read

# Called by release.yml, github.workflow is "release": its gates get their own
# group, so a release dry run and a push on the same branch never cancel or
# queue behind each other. Only a pull request's newer push cancels a run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: elioseverojunior/rust-toolchain@53d2299d557a901de7517771d4ce9e89b70d4439 # v0.8.0-5
      - run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: elioseverojunior/rust-toolchain@53d2299d557a901de7517771d4ce9e89b70d4439 # v0.8.0-5
        with:
          cache: true
          cache-key-hash: ${{ hashFiles('**/Cargo.lock') }}
          cache-key-suffix: clippy
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The end-to-end tests of `nvm init` and the contract run in every
      # shell nvmrc supports and skip the missing ones: on Linux all are
      # installed; macOS has bash, zsh, sh, dash and ksh already.
      - name: Install every shell
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dash fish ksh zsh
      - uses: elioseverojunior/rust-toolchain@53d2299d557a901de7517771d4ce9e89b70d4439 # v0.8.0-5
        with:
          cache: true
          cache-key-hash: ${{ hashFiles('**/Cargo.lock') }}
          cache-key-suffix: test
      - run: cargo test --locked

  msrv:
    name: msrv (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain of rust-toolchain.toml and, next to it, the
      # rust-version of Cargo.toml, reachable as `cargo +1.85`.
      - uses: elioseverojunior/rust-toolchain@53d2299d557a901de7517771d4ce9e89b70d4439 # v0.8.0-5
        with:
          msrv-install: true
          cache: true
          cache-key-hash: ${{ hashFiles('**/Cargo.lock') }}
          cache-key-suffix: msrv
      - run: cargo +1.85 check --all-targets --locked

  supply-chain:
    name: cargo deny and cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: elioseverojunior/rust-toolchain@53d2299d557a901de7517771d4ce9e89b70d4439 # v0.8.0-5
        with:
          cargo-tools: cargo-deny@0.20.2,cargo-audit@0.22.2
          cache: true
          cache-key-hash: ${{ hashFiles('**/Cargo.lock') }}
          cache-key-suffix: supply-chain
      - run: cargo deny check
      - run: cargo audit

  docs:
    name: markdown (rumdl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run rumdl check .

  nix:
    name: nix build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: nix flake check
      - run: nix build .#nvmrc
      - name: The Nix build prints the version of Cargo.toml
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          test "$(./result/bin/nvm --version)" = "nvm $version"
