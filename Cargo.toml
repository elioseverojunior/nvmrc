[package]
name = "nvmrc"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
description = "A native Rust port of nvm, the Node Version Manager"
license = "MIT"
repository = "https://github.com/elioseverojunior/nvmrc"
keywords = ["nvm", "node", "nodejs", "version-manager", "shell"]
categories = ["command-line-utilities", "development-tools"]
# Ready for crates.io, but not published until the owner decides to.
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = "1.1.10"
lzma-rust2 = { version = "0.21.0", default-features = false, features = ["std", "xz", "optimization"] }
sha2 = "0.11.0"
tar = { version = "0.4.46", default-features = false }
thiserror = "2"
ureq = { version = "3", features = ["platform-verifier"] }

[dev-dependencies]
lzma-rust2 = { version = "0.21.0", features = ["encoder"] }
tempfile = "3"

[[bin]]
name = "nvmrc"
path = "src/main.rs"

[[bin]]
name = "nvm"
path = "src/bin/nvm.rs"

[[bin]]
name = "nvm-exec"
path = "src/bin/nvm-exec.rs"
