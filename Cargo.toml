[package]
name = "nvmrc"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "2"
ureq = "3"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "nvmrc"
path = "src/main.rs"

[[bin]]
name = "nvm"
path = "src/bin/nvm.rs"
