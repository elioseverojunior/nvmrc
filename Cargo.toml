[package]
name = "nvmrc"
version = "0.0.2"
edition = "2024"
rust-version = "1.85"
description = "A native Rust port of nvm, the Node Version Manager"
license = "MIT"
repository = "https://github.com/elioseverojunior/nvmrc"
readme = "README.md"
keywords = ["nvm", "node", "nodejs", "version-manager", "shell"]
categories = ["command-line-utilities", "development-tools"]
# The crate ships what `cargo install nvmrc` builds; tests, fixtures, CI and
# packaging stay in the repository.
include = ["/src/**/*.rs", "/schemas/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]

[dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = "1.1.10"
lzma-rust2 = { version = "0.21.0", default-features = false, features = ["std", "xz", "optimization"] }
nodejs-semver = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tar = { version = "0.4.46", default-features = false }
thiserror = "2"
ureq = { version = "3", features = ["platform-verifier"] }

[dev-dependencies]
lzma-rust2 = { version = "0.21.0", features = ["encoder"] }
schemars = "1"
tempfile = "3"

[[bin]]
name = "nvmrc"
path = "src/main.rs"

[[bin]]
name = "nvm"
path = "src/bin/nvm.rs"

[[bin]]
name = "nvm-exec"
path = "src/bin/nvm-exec.rs"
